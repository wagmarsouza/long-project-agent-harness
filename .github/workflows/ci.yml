name: VeriMission qualification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified upstream
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install isolated qualification dependency
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run all qualification gates
        run: python -B tasks/ci_v83.py --output ci-results
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qualification-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  required:
    name: Qualification required
    if: always()
    needs: qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse failed, cancelled or skipped qualification
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: test "$QUALIFICATION_RESULT" = success
